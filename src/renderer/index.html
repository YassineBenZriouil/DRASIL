<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws://localhost:*"
        />
        <title>Drasil</title>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <header>
            <h1>Drasil</h1>
            <div class="group" role="toolbar" aria-label="History">
                <button id="back" title="Back (Alt+Left)" disabled>
                    ← Back
                </button>
                <button id="forward" title="Forward (Alt+Right)" disabled>
                    Forward →
                </button>
                <button id="up" title="Parent folder (Alt+Up)" disabled>
                    ↑ Up
                </button>
            </div>
            <nav id="locations" aria-label="Locations"></nav>
            <input
                id="search"
                type="search"
                placeholder="Search"
                aria-label="Search names in the current location (Ctrl+F)"
                aria-controls="search-panel"
                disabled
            />
            <button
                id="toggle-filters"
                title="Filters, sorting and highlights"
                aria-pressed="false"
                aria-controls="filters-panel"
            >
                Filters
            </button>
            <div class="group end" role="toolbar" aria-label="View">
                <button id="fit" title="See the whole tree (Home)">
                    Overview
                </button>
                <button id="locate" title="Center on the selection (C)">
                    Locate
                </button>
                <button
                    id="toggle-inspector"
                    title="Show or hide details (I)"
                    aria-pressed="true"
                    aria-controls="inspector"
                >
                    Details
                </button>
            </div>
        </header>
        <nav id="crumbs" aria-label="Path"></nav>
        <main>
            <div class="stage">
                <canvas
                    id="world"
                    tabindex="0"
                    aria-label="File tree. Click a folder to open or close it, double-click to make it the root. Double-click a file to open it. Ctrl-click (Cmd-click on Mac) selects several items. Drag empty space to move around, drag items onto a folder to move them (hold Ctrl, or Option on Mac, to copy). Right-click or press the menu key for actions. Scroll to zoom. Enter opens, Home shows the whole tree, C centers the selection, Escape clears the selection, plus and minus zoom, F9 shows performance stats."
                ></canvas>
                <section
                    id="search-panel"
                    class="panel left"
                    aria-label="Search results"
                    hidden
                >
                    <p id="search-status" role="status"></p>
                    <ul id="search-results" role="listbox"></ul>
                    <p class="hint-inline">
                        Links aren’t followed, and virtual system folders are
                        skipped.
                    </p>
                </section>
                <section
                    id="filters-panel"
                    class="panel right"
                    aria-label="Filters and sorting"
                    hidden
                ></section>
                <p id="hint" class="hint">
                    Choose a location to start exploring.
                </p>
            </div>
            <aside id="inspector" aria-label="Details">
                <p class="hint-inline">Select a file or folder.</p>
            </aside>
        </main>
        <div id="notices" role="status" aria-live="polite"></div>
        <footer>
            <div id="status" aria-live="polite"></div>
            <div id="ops"></div>
            <div id="filter-status" role="status"></div>
            <div id="activity"></div>
            <div class="legend" aria-label="Folder shapes">
                <span>◌ not scanned</span>
                <span>○ empty</span>
                <span>● opened</span>
                <span>◉ closed</span>
                <span>◐ partial</span>
                <span>⊗ no access</span>
                <span>△ error</span>
            </div>
        </footer>
        <dialog id="dialog"></dialog>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
